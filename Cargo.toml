[package]
name = "dns-over-websocket"
description = "Transport-independent DNS over WebSocket protocol"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sn0wo2/dns-over-websocket"

[dependencies]
base64 = "0.23"
domain = { version = "0.12", default-features = false, features = ["std"] }
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
