version: 2

project_name: dns-over-websocket

builds:
  - skip: true

source:
  enabled: false

archives:
  - id: source
    meta: true
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_source"
    files:
      - "src/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: true
